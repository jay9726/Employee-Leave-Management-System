<svg width="960" height="868" viewBox="0 0 960 868" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient from blue-purple to pink-red (left to right, top to bottom) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="960" height="868" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <!-- Bottom-left circle -->
  <circle cx="220" cy="680" r="60" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.4"/>
  
  <!-- Top-right circle -->
  <circle cx="720" cy="120" r="80" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.4"/>
  
  <!-- Main card container with border -->
  <rect x="320" y="85" width="320" height="320" rx="28" 
        fill="#8b5cf6" fill-opacity="0.25" 
        stroke="#a78bfa" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- User Plus icon centered in card -->
  <g transform="translate(480, 245)">
    <!-- User head (circle) -->
    <circle cx="-20" cy="-30" r="35" 
            fill="none" stroke="white" stroke-width="18" 
            stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- User body (arc) -->
    <path d="M -65,50 Q -65,0 -20,0 Q 25,0 25,0 L 25,50" 
          fill="none" stroke="white" stroke-width="18" 
          stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Plus sign -->
    <!-- Vertical line -->
    <line x1="45" y1="-15" x2="45" y2="25" 
          stroke="white" stroke-width="18" 
          stroke-linecap="round"/>
    
    <!-- Horizontal line -->
    <line x1="25" y1="5" x2="65" y2="5" 
          stroke="white" stroke-width="18" 
          stroke-linecap="round"/>
  </g>
  
  <!-- Join Us Today! heading -->
  <text x="480" y="480" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="52" 
        font-weight="700" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="-0.5">Join Us Today!</text>
  
  <!-- Description text line 1 -->
  <text x="480" y="540" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="20" 
        fill="white" 
        fill-opacity="0.95" 
        text-anchor="middle">Create your account and become part of our growing</text>
  
  <!-- Description text line 2 -->
  <text x="480" y="570" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="20" 
        fill="white" 
        fill-opacity="0.95" 
        text-anchor="middle">community.</text>
  
  <!-- Features list -->
  <g transform="translate(200, 640)">
    
    <!-- Feature 1: Quick Setup Process -->
    <g>
      <circle cx="12" cy="12" r="11" fill="none" stroke="white" stroke-width="2.5"/>
      <path d="M 7,12 L 11,16 L 18,8" 
            fill="none" stroke="white" stroke-width="2.5" 
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="18" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="19" 
            fill="white" 
            fill-opacity="0.95">Quick Setup Process</text>
    </g>
    
    <!-- Feature 2: Secure & Private -->
    <g transform="translate(0, 50)">
      <circle cx="12" cy="12" r="11" fill="none" stroke="white" stroke-width="2.5"/>
      <path d="M 7,12 L 11,16 L 18,8" 
            fill="none" stroke="white" stroke-width="2.5" 
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="18" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="19" 
            fill="white" 
            fill-opacity="0.95">Secure &amp; Private</text>
    </g>
    
    <!-- Feature 3: Join Thousands of Users -->
    <g transform="translate(0, 100)">
      <circle cx="12" cy="12" r="11" fill="none" stroke="white" stroke-width="2.5"/>
      <path d="M 7,12 L 11,16 L 18,8" 
            fill="none" stroke="white" stroke-width="2.5" 
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="18" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="19" 
            fill="white" 
            fill-opacity="0.95">Join Thousands of Users</text>
    </g>
    
  </g>
  
</svg>
