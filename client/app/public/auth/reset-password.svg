<svg width="960" height="868" viewBox="0 0 960 868" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient from blue to purple (left to right, top to bottom) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="960" height="868" fill="url(#bgGradient)"/>
  
  <!-- Key icon centered at top -->
  <g transform="translate(480, 240)">
    <!-- Key head (circle) -->
    <circle cx="0" cy="0" r="75" 
            fill="none" stroke="white" stroke-width="28" 
            stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Key hole inside circle -->
    <circle cx="0" cy="0" r="22" fill="white"/>
    
    <!-- Key shaft -->
    <path d="M -52,52 L -130,130" 
          fill="none" stroke="white" stroke-width="28" 
          stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Key teeth (notches) -->
    <path d="M -90,90 L -90,110 M -110,110 L -110,130" 
          fill="none" stroke="white" stroke-width="28" 
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Almost There! heading -->
  <text x="480" y="480" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="52" 
        font-weight="700" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="-0.5">Almost There!</text>
  
  <!-- Description text -->
  <text x="480" y="530" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="19" 
        fill="white" 
        fill-opacity="0.92" 
        text-anchor="middle">Create a strong password to secure your account and keep your information safe.</text>
  
  <!-- Password Tips Box -->
  <rect x="80" y="580" width="800" height="180" rx="16" 
        fill="#6366f1" fill-opacity="0.3"/>
  
  <!-- Password Tips content -->
  <g transform="translate(110, 620)">
    
    <!-- Info icon and title -->
    <g>
      <!-- Info icon circle -->
      <circle cx="15" cy="15" r="14" 
              fill="none" stroke="white" stroke-width="2.5"/>
      <!-- Info 'i' -->
      <circle cx="15" cy="10" r="2" fill="white"/>
      <line x1="15" y1="14" x2="15" y2="22" 
            stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Password Tips text -->
      <text x="45" y="21" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="20" 
            font-weight="600" 
            fill="white">Password Tips</text>
    </g>
    
    <!-- Tip 1: At least 8 characters long -->
    <g transform="translate(0, 55)">
      <!-- Check icon -->
      <path d="M 5,10 L 9,14 L 16,6" 
            fill="none" stroke="white" stroke-width="2.5" 
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Text -->
      <text x="35" y="15" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="17" 
            fill="white" 
            fill-opacity="0.9">At least 8 characters long</text>
    </g>
    
    <!-- Tip 2: Mix of letters, numbers & symbols -->
    <g transform="translate(0, 90)">
      <!-- Check icon -->
      <path d="M 5,10 L 9,14 L 16,6" 
            fill="none" stroke="white" stroke-width="2.5" 
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Text -->
      <text x="35" y="15" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="17" 
            fill="white" 
            fill-opacity="0.9">Mix of letters, numbers &amp; symbols</text>
    </g>
    
    <!-- Tip 3: Avoid common words or patterns -->
    <g transform="translate(0, 125)">
      <!-- Check icon -->
      <path d="M 5,10 L 9,14 L 16,6" 
            fill="none" stroke="white" stroke-width="2.5" 
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Text -->
      <text x="35" y="15" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="17" 
            fill="white" 
            fill-opacity="0.9">Avoid common words or patterns</text>
    </g>
    
  </g>
  
</svg>
