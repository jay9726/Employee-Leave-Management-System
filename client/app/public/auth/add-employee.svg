<svg width="800" height="750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Blur filter for decorative circles -->
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="750" fill="url(#bgGradient)" />
  
  <!-- Decorative blurred circles -->
  <circle cx="130" cy="130" r="64" fill="white" opacity="0.1" filter="url(#blur)" />
  <circle cx="670" cy="620" r="80" fill="white" opacity="0.1" filter="url(#blur)" />
  
  <!-- Main content group -->
  <g transform="translate(400, 75)">
    
    <!-- Icon container -->
    <g transform="translate(-80, 0)">
      <rect x="0" y="0" width="160" height="160" rx="24" fill="white" opacity="0.1" />
      <rect x="0" y="0" width="160" height="160" rx="24" fill="none" stroke="white" stroke-width="4" opacity="0.2" />
      
      <!-- UserPlus Icon -->
      <g transform="translate(32, 32)">
        <circle cx="48" cy="36" r="16" fill="none" stroke="white" stroke-width="2.5" />
        <path d="M 24 76 Q 24 60, 48 60 Q 72 60, 72 76" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" />
        <line x1="84" y1="48" x2="96" y2="48" stroke="white" stroke-width="2.5" stroke-linecap="round" />
        <line x1="90" y1="42" x2="90" y2="54" stroke="white" stroke-width="2.5" stroke-linecap="round" />
      </g>
    </g>
    
    <!-- Title -->
    <text x="0" y="220" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">
      Welcome to the Team!
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="265" font-family="Arial, sans-serif" font-size="18" fill="#bfdbfe" text-anchor="middle">
      Add new team members and grant them
    </text>
    <text x="0" y="290" font-family="Arial, sans-serif" font-size="18" fill="#bfdbfe" text-anchor="middle">
      access to your organization's resources.
    </text>
    
    <!-- Feature cards -->
    
    <!-- Card 1: Instant Access -->
    <g transform="translate(-180, 330)">
      <rect x="0" y="0" width="360" height="80" rx="12" fill="white" opacity="0.1" />
      
      <!-- Icon container -->
      <rect x="16" y="20" width="40" height="40" rx="8" fill="white" opacity="0.2" />
      
      <!-- CheckCircle Icon -->
      <g transform="translate(36, 40)">
        <circle cx="0" cy="0" r="10" fill="none" stroke="white" stroke-width="2" />
        <polyline points="-4,0 -1,3 4,-3" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>
      
      <!-- Text -->
      <text x="72" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white">
        Instant Access
      </text>
      <text x="72" y="58" font-family="Arial, sans-serif" font-size="14" fill="#bfdbfe">
        Users get immediate access
      </text>
    </g>
    
    <!-- Card 2: Secure & Safe -->
    <g transform="translate(-180, 430)">
      <rect x="0" y="0" width="360" height="80" rx="12" fill="white" opacity="0.1" />
      
      <!-- Icon container -->
      <rect x="16" y="20" width="40" height="40" rx="8" fill="white" opacity="0.2" />
      
      <!-- Shield Icon -->
      <g transform="translate(36, 40)">
        <path d="M 0,-10 L 6,-7 L 6,2 Q 6,8 0,10 Q -6,8 -6,2 L -6,-7 Z" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" />
      </g>
      
      <!-- Text -->
      <text x="72" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white">
        Secure &amp; Safe
      </text>
      <text x="72" y="58" font-family="Arial, sans-serif" font-size="14" fill="#bfdbfe">
        Protected with encryption
      </text>
    </g>
    
    <!-- Card 3: Email Invitation -->
    <g transform="translate(-180, 530)">
      <rect x="0" y="0" width="360" height="80" rx="12" fill="white" opacity="0.1" />
      
      <!-- Icon container -->
      <rect x="16" y="20" width="40" height="40" rx="8" fill="white" opacity="0.2" />
      
      <!-- Mail Icon -->
      <g transform="translate(36, 40)">
        <rect x="-10" y="-6" width="20" height="14" rx="2" fill="none" stroke="white" stroke-width="2" />
        <polyline points="-10,-6 0,0 10,-6" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round" />
      </g>
      
      <!-- Text -->
      <text x="72" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white">
        Email Invitation
      </text>
      <text x="72" y="58" font-family="Arial, sans-serif" font-size="14" fill="#bfdbfe">
        Auto-sent welcome email
      </text>
    </g>
    
  </g>
</svg>
