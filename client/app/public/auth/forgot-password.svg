<svg width="960" height="868" viewBox="0 0 960 868" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient from blue to purple (left to right, top to bottom) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="960" height="868" fill="url(#bgGradient)"/>
  
  <!-- Lock icon centered at top -->
  <g transform="translate(480, 290)">
    <!-- Lock body (rounded rectangle) -->
    <rect x="-100" y="-35" width="200" height="140" rx="20" 
          fill="white" stroke="none"/>
    
    <!-- Lock shackle (arc) -->
    <path d="M -70,-35 L -70,-95 Q -70,-135 0,-135 Q 70,-135 70,-95 L 70,-35" 
          fill="none" stroke="white" stroke-width="32" 
          stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Keyhole dot -->
    <circle cx="0" cy="30" r="22" fill="#6366f1"/>
  </g>
  
  <!-- Don't Worry! heading -->
  <text x="480" y="580" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="52" 
        font-weight="700" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="-0.5">Don't Worry!</text>
  
  <!-- Description text line 1 -->
  <text x="480" y="640" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="19" 
        fill="white" 
        fill-opacity="0.92" 
        text-anchor="middle">It happens to the best of us. We'll help you reset your password and get back to</text>
  
  <!-- Description text line 2 -->
  <text x="480" y="670" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="19" 
        fill="white" 
        fill-opacity="0.92" 
        text-anchor="middle">your account in no time.</text>
  
</svg>
