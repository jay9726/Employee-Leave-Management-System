<svg width="960" height="866" viewBox="0 0 960 866" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient from blue to purple (left to right, top to bottom) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="960" height="866" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <!-- Bottom-left circle -->
  <circle cx="220" cy="680" r="60" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.4"/>
  
  <!-- Top-right circle -->
  <circle cx="720" cy="120" r="80" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.4"/>
  
  <!-- Main card container with border -->
  <rect x="320" y="85" width="320" height="320" rx="28" 
        fill="#5b51d8" fill-opacity="0.3" 
        stroke="#6366f1" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Lock icon centered in card -->
  <g transform="translate(480, 245)">
    <!-- Lock body -->
    <rect x="-55" y="-20" width="110" height="90" rx="12" 
          fill="white" stroke="none"/>
    
    <!-- Lock shackle -->
    <path d="M -35,-20 L -35,-55 Q -35,-75 0,-75 Q 35,-75 35,-55 L 35,-20" 
          fill="none" stroke="white" stroke-width="18" 
          stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Keyhole circle -->
    <circle cx="0" cy="20" r="12" fill="#5b51d8"/>
    
    <!-- Keyhole slot -->
    <rect x="-5" y="28" width="10" height="22" rx="2" fill="#5b51d8"/>
  </g>
  
  <!-- Welcome Back! heading -->
  <text x="480" y="480" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="52" 
        font-weight="700" 
        fill="white" 
        text-anchor="middle"
        letter-spacing="-0.5">Welcome Back!</text>
  
  <!-- Description text line 1 -->
  <text x="480" y="540" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="20" 
        fill="white" 
        fill-opacity="0.95" 
        text-anchor="middle">Sign in to access your account and continue your</text>
  
  <!-- Description text line 2 -->
  <text x="480" y="570" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" 
        font-size="20" 
        fill="white" 
        fill-opacity="0.95" 
        text-anchor="middle">journey with us.</text>
  
  <!-- Features list -->
  <g transform="translate(200, 640)">
    
    <!-- Feature 1: Secure Authentication -->
    <g>
      <circle cx="12" cy="12" r="11" fill="none" stroke="white" stroke-width="2.5"/>
      <path d="M 7,12 L 11,16 L 18,8" 
            fill="none" stroke="white" stroke-width="2.5" 
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="18" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="19" 
            fill="white" 
            fill-opacity="0.95">Secure Authentication</text>
    </g>
    
    <!-- Feature 2: Fast & Reliable -->
    <g transform="translate(0, 50)">
      <circle cx="12" cy="12" r="11" fill="none" stroke="white" stroke-width="2.5"/>
      <path d="M 7,12 L 11,16 L 18,8" 
            fill="none" stroke="white" stroke-width="2.5" 
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="18" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="19" 
            fill="white" 
            fill-opacity="0.95">Fast &amp; Reliable</text>
    </g>
    
    <!-- Feature 3: 24/7 Support -->
    <g transform="translate(0, 100)">
      <circle cx="12" cy="12" r="11" fill="none" stroke="white" stroke-width="2.5"/>
      <path d="M 7,12 L 11,16 L 18,8" 
            fill="none" stroke="white" stroke-width="2.5" 
            stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="18" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
            font-size="19" 
            fill="white" 
            fill-opacity="0.95">24/7 Support</text>
    </g>
    
  </g>
  
</svg>
